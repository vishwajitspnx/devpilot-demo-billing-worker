name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check config and data files are valid JSON
        run: for f in config/*.json data/*.json; do python -m json.tool "$f" > /dev/null || exit 1; done
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Unit tests
        run: pytest -q
